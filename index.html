         The stub runs inline and immediately: it defines gtag() and queues every
         call into dataLayer, so conversions fired before the remote tag lands are

         a script that paints nothing. It is pulled in on whichever comes first:
         window load, or the first sign of a user who might convert. -->

      function gtag(){dataLayer.push(arguments);}

      gtag('config', 'AW-18345460239');

      (function () {
        var loaded = false;
        function loadGtag() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18345460239';
          document.head.appendChild(s);
        }
        var events = ['pointerdown', 'keydown', 'touchstart', 'scroll'];
        events.forEach(function (e) {
          window.addEventListener(e, loadGtag, {once: true, passive: true, capture: true});
        });
        if (document.readyState === 'complete') loadGtag();
        else window.addEventListener('load', loadGtag, {once: true});
      })();
    </script>
